[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optarb"
version = "0.2.0"
description = "Model-free option no-arbitrage checks at executable prices, with a study of how often they break."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "duckdb>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.18"]
schwab = ["schwab-py>=1.4,<2.0"]
dev = ["pytest>=8", "ruff>=0.5", "streamlit>=1.35", "plotly>=5.18"]

[project.scripts]
optarb = "optarb.cli:main"

[tool.setuptools.packages.find]
include = ["optarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "UP042", "SIM108"]
